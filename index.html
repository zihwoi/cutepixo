<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <title>CutePixo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="cutepixo.ico" type="image/x-icon">
</head>
<body>
    <h1>CUTEPIXO</h1>
    <div class="container">
        <div class="controls">
            <input type="color" id="colorPicker" value="#000000">
            <button id="clearBtn">Clear Canvas</button>
            <button id="saveBtn">Save Logo</button>
            <select id="fileFormatSelector">
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
                <option value="ico">ICO</option>
            </select>
            <button id="saveAsBtn">Save As...</button>
            <select id="pixelArtSelector">
                <option value="heart">Heart</option>
                <option value="smiley">Smiley</option>
                <option value="star">Star</option>
            </select>
            <button id="generateArtBtn">Generate Pixel Art</button>
            <button id="toggleDarkMode">Toggle Dark Mode</button>
            <button id="eraserBtn">Eraser</button>
            <div class="background-color-picker">
                <label for="bgColorPicker">Background:</label>
                <input type="color" id="bgColorPicker" value="#ffffff">
                <input type="checkbox" id="transparentBg">
                <label for="transparentBg">Transparent</label>
            </div>
        </div>
        <canvas id="pixelCanvas" width="500" height="500"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
